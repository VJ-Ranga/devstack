
worker_processes  1;

error_log  logs/error.log  warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 128M;

    sendfile      on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # auto-synced by DevStack Manager on start
        root   D:/Project/portable-stack-plan/devstack-template/htdocs;
        index  index.php index.html index.htm;

        location = /favicon.ico {
            log_not_found off;
            access_log    off;
            return 204;
        }

        location / {
            try_files $uri $uri/ @site_fallback;
        }

        # Each site handles its own 404 via its own index.php
        location @site_fallback {
            rewrite ^(/[^/]+)(/.*)?$ $1/index.php?$args last;
            rewrite ^                /index.php?$args    last;
        }

        location ~ \.php$ {
            try_files         $uri =404;
            fastcgi_pass      127.0.0.1:9000;
            fastcgi_index     index.php;
            fastcgi_param     SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include           fastcgi_params;
            fastcgi_keep_conn on;
            fastcgi_read_timeout 120s;
        }

        location ~ /\.ht {
            deny all;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root html; }
    }
}
