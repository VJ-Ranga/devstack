[mysqld]
# DEVSTACK: basedir and datadir are auto-updated by DevStack Manager on every start.
# Do not edit manually — your changes will be overwritten.
basedir = "D:/Project/portable-stack-plan/devstack-template/mysql"
datadir = "D:/Project/portable-stack-plan/devstack-template/mysql/data"
port = 3306
character-set-server  = utf8mb4
default-storage-engine = InnoDB
sql-mode = ""

# Performance tuning for local development
innodb_buffer_pool_size     = 256M   # cache more data in RAM — biggest single win
innodb_flush_log_at_trx_commit = 2   # flush every second instead of per-commit (safe for dev)
innodb_log_file_size        = 64M
query_cache_type            = 0      # query cache is deprecated — disable to avoid contention
skip-name-resolve                    # skip DNS lookups on connections — faster auth

[client]
port = 3306
default-character-set = utf8mb4
